name: Mobile CI

on:
  workflow_dispatch:
    inputs:
      run_ios:
        description: "Ejecutar validación iOS en runner macOS"
        required: false
        default: false
        type: boolean
      uat_backend_url:
        description: "URL HTTPS del backend UAT (obligatoria para builds manuales; nunca producción)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
      - develop
    paths:
      - front_movil/**
      - .github/workflows/mobile-ci.yml
  pull_request:
    branches:
      - main
      - develop
    paths:
      - front_movil/**
      - .github/workflows/mobile-ci.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Flutter Android CI
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || vars.ENABLE_GITHUB_HOSTED_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: front_movil
        run: flutter pub get

      - name: Check formatting
        working-directory: front_movil
        shell: bash
        run: |
          dart format lib test
          if ! git diff --exit-code -- lib test; then
            echo "::error::Dart formatting changes are required."
            git diff -- lib test
            exit 1
          fi

      - name: Analyze
        working-directory: front_movil
        run: flutter analyze

      - name: Run tests
        working-directory: front_movil
        run: flutter test

      - name: Generate HIPOCRATIQ launcher icons
        working-directory: front_movil
        run: dart run flutter_launcher_icons

      - name: Resolve isolated backend for validation build
        id: backend_target
        shell: bash
        env:
          UAT_BACKEND_URL: ${{ inputs.uat_backend_url || '' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import urlsplit

          is_manual = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          target = os.environ.get("UAT_BACKEND_URL", "").strip()
          if not is_manual:
              target = "https://hipocratiq-ci.invalid/backend"
          else:
              parsed = urlsplit(target)
              hostname = parsed.hostname or ""
              marker = re.search(r"(^|[.-])(uat|staging|qa)([.-]|$)", hostname, re.I)
              if (
                  parsed.scheme != "https"
                  or not hostname
                  or parsed.username
                  or parsed.password
                  or parsed.query
                  or parsed.fragment
                  or not marker
              ):
                  print(
                      "::error::La build manual requiere HTTPS en un host identificado como UAT, staging o QA; se rechaza producción.",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"backend_url={target}\n")
          PY

      - name: Build Android APK
        working-directory: front_movil
        run: >-
          flutter build apk --debug
          --dart-define=BACKEND_URL=${{ steps.backend_target.outputs.backend_url }}
          --dart-define=SUPPORT_PORTAL_URL=https://hipocratiq.com

      - name: Build Android AAB
        working-directory: front_movil
        run: >-
          flutter build appbundle --debug
          --dart-define=BACKEND_URL=${{ steps.backend_target.outputs.backend_url }}
          --dart-define=SUPPORT_PORTAL_URL=https://hipocratiq.com

      - name: Calculate APK and AAB SHA-256
        working-directory: front_movil
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          test -s build/app/outputs/bundle/debug/app-debug.aab
          sha256sum \
            build/app/outputs/flutter-apk/app-debug.apk \
            build/app/outputs/bundle/debug/app-debug.aab \
            | tee build/android-validation-sha256.txt

      - name: Upload Android validation builds
        uses: actions/upload-artifact@v4
        with:
          name: hipocratiq-android-ci-build-not-uat
          if-no-files-found: error
          path: |
            front_movil/build/app/outputs/flutter-apk/app-debug.apk
            front_movil/build/app/outputs/bundle/debug/app-debug.aab
            front_movil/build/android-validation-sha256.txt

  ios:
    name: Flutter iOS CI
    if: github.event_name == 'workflow_dispatch' && inputs.run_ios
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: front_movil
        run: flutter pub get

      - name: Read Xcode toolchain
        run: xcodebuild -version

      - name: Check Dart format (without modifying sources)
        working-directory: front_movil
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        working-directory: front_movil
        run: flutter analyze

      - name: Flutter unit/widget tests
        working-directory: front_movil
        run: flutter test

      - name: Generate HIPOCRATIQ launcher icons
        working-directory: front_movil
        run: dart run flutter_launcher_icons

      - name: Resolve isolated backend for validation build
        id: backend_target
        shell: bash
        env:
          UAT_BACKEND_URL: ${{ inputs.uat_backend_url || '' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import urlsplit

          is_manual = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          target = os.environ.get("UAT_BACKEND_URL", "").strip()
          if not is_manual:
              target = "https://hipocratiq-ci.invalid/backend"
          else:
              parsed = urlsplit(target)
              hostname = parsed.hostname or ""
              marker = re.search(r"(^|[.-])(uat|staging|qa)([.-]|$)", hostname, re.I)
              if (
                  parsed.scheme != "https"
                  or not hostname
                  or parsed.username
                  or parsed.password
                  or parsed.query
                  or parsed.fragment
                  or not marker
              ):
                  print(
                      "::error::La build manual requiere HTTPS en un host identificado como UAT, staging o QA; se rechaza producción.",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"backend_url={target}\n")
          PY

      - name: Build iOS without code signing
        working-directory: front_movil
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=BACKEND_URL=${{ steps.backend_target.outputs.backend_url }}
          --dart-define=SUPPORT_PORTAL_URL=https://hipocratiq.com

      - name: Upload iOS validation build
        uses: actions/upload-artifact@v4
        with:
          name: hipocratiq-ios-ci-build-not-uat
          if-no-files-found: error
          path: front_movil/build/ios/iphoneos/Runner.app
