name: Mobile CI

on:
  workflow_dispatch:
    inputs:
      run_ios:
        description: "Ejecutar validación iOS en runner macOS"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - develop
      - qa/mobile-qa-direct-role-access-20261007
    paths:
      - front_movil/**
      - .github/workflows/mobile-ci.yml
  pull_request:
    branches:
      - main
      - develop
    paths:
      - front_movil/**
      - .github/workflows/mobile-ci.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Flutter Android CI
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/qa/mobile-qa-direct-role-access-20261007' || vars.ENABLE_GITHUB_HOSTED_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: front_movil
        run: flutter pub get

      - name: Check formatting
        working-directory: front_movil
        shell: bash
        run: |
          dart format lib test
          if ! git diff --exit-code -- lib test; then
            echo "::error::Dart formatting changes are required."
            git diff -- lib test
            exit 1
          fi

      - name: Analyze
        working-directory: front_movil
        run: flutter analyze

      - name: Run tests
        working-directory: front_movil
        run: flutter test

      - name: Generate HIPOCRATIQ launcher icons
        working-directory: front_movil
        run: dart run flutter_launcher_icons

      - name: Build Android APK
        working-directory: front_movil
        run: >-
          flutter build apk --debug
          --dart-define=BACKEND_URL=https://hipocratiq.com/backend
          --dart-define=SUPPORT_PORTAL_URL=https://hipocratiq.com
          --dart-define=AUTH_BYPASS=true

      - name: Build Android AAB
        working-directory: front_movil
        run: >-
          flutter build appbundle --debug
          --dart-define=BACKEND_URL=https://hipocratiq.com/backend
          --dart-define=SUPPORT_PORTAL_URL=https://hipocratiq.com
          --dart-define=AUTH_BYPASS=true

      - name: Upload Android validation builds
        uses: actions/upload-artifact@v4
        with:
          name: HIPOCRATIQ-Android-QA-DirectRole-20261007
          if-no-files-found: error
          path: |
            front_movil/build/app/outputs/flutter-apk/app-debug.apk
            front_movil/build/app/outputs/bundle/debug/app-debug.aab

  ios:
    name: Flutter iOS CI
    if: github.event_name == 'workflow_dispatch' && inputs.run_ios
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: front_movil
        run: flutter pub get

      - name: Generate HIPOCRATIQ launcher icons
        working-directory: front_movil
        run: dart run flutter_launcher_icons

      - name: Build iOS without code signing
        working-directory: front_movil
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=BACKEND_URL=https://hipocratiq.com/backend
          --dart-define=SUPPORT_PORTAL_URL=https://hipocratiq.com
          --dart-define=AUTH_BYPASS=true

      - name: Upload iOS validation build
        uses: actions/upload-artifact@v4
        with:
          name: hipocratiq-ios-validation
          if-no-files-found: error
          path: front_movil/build/ios/iphoneos/Runner.app
