name: Frontend release gate regression tests

on:
  pull_request:
    branches: [develop]
    paths:
      - "front_web/scripts/release-readiness-check.mjs"
      - "front_web/scripts/release-readiness-check.regression.test.mjs"
      - ".github/workflows/release-gate-regression.yml"
  push:
    branches: [develop]
    paths:
      - "front_web/scripts/release-readiness-check.mjs"
      - "front_web/scripts/release-readiness-check.regression.test.mjs"
      - ".github/workflows/release-gate-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fail-closed:
    name: Verify release evidence is fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run independent Node test harness
        run: node --test front_web/scripts/release-readiness-check.regression.test.mjs
