name: Deploy Frontend Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe DEPLOY para confirmar producción"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hipocratiq-production-frontend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    runs-on: [self-hosted, linux, x64, hipocratiq-vps]
    timeout-minutes: 30
    steps:
      - name: Check out release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Deploy frontend with rollback guard
        env:
          PRODUCTION_DIR: /srv/hipocratiq/frontend
          COMPOSE_PROJECT: hipocratiq-front-web
          HEALTH_URL: https://hipocratiq.com/
        run: bash scripts/deploy-production.sh
